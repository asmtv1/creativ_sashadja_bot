name: CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://course:course@localhost:5432/course?schema=public
        run: pnpm db:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main'
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deploy secrets
        run: |
          set -euo pipefail
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_PATH; do
            if [ -z "${!name}" ]; then
              echo "Missing required GitHub secret: $name" >&2
              exit 1
            fi
          done

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "Missing required GitHub secret: DEPLOY_SSH_KEY" >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${DEPLOY_PORT:-22}" "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Build production env file
        env:
          API_IMAGE: tgbot/api:${{ github.sha }}
          BOT_IMAGE: tgbot/bot:${{ github.sha }}
          MINIAPP_IMAGE: tgbot/miniapp:${{ github.sha }}
          MIGRATE_IMAGE: tgbot/migrate:${{ github.sha }}
          PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}
          CADDY_SITE_ADDRESS: ${{ secrets.CADDY_SITE_ADDRESS }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_USERNAME: ${{ secrets.TELEGRAM_BOT_USERNAME }}
          TELEGRAM_PAYMENT_PROVIDER_TOKEN: ${{ secrets.TELEGRAM_PAYMENT_PROVIDER_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          INTERNAL_API_TOKEN: ${{ secrets.INTERNAL_API_TOKEN }}
          ADMIN_BASIC_USER: ${{ secrets.ADMIN_BASIC_USER }}
          ADMIN_BASIC_PASSWORD: ${{ secrets.ADMIN_BASIC_PASSWORD }}
          YOOKASSA_SHOP_ID: ${{ secrets.YOOKASSA_SHOP_ID }}
          YOOKASSA_SECRET_KEY: ${{ secrets.YOOKASSA_SECRET_KEY }}
          YOOKASSA_WEBHOOK_SECRET: ${{ secrets.YOOKASSA_WEBHOOK_SECRET }}
          YOOKASSA_CURRENCY: ${{ secrets.YOOKASSA_CURRENCY }}
          MINIAPP_SESSION_SECRET: ${{ secrets.MINIAPP_SESSION_SECRET }}
          MINIAPP_SESSION_TTL_SECONDS: ${{ secrets.MINIAPP_SESSION_TTL_SECONDS }}
          KINESCOPE_API_TOKEN: ${{ secrets.KINESCOPE_API_TOKEN }}
          KINESCOPE_PRIVACY_MODE: ${{ secrets.KINESCOPE_PRIVACY_MODE }}
          COURSE_SLUG: ${{ secrets.COURSE_SLUG }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");

          const env = process.env;
          const required = [
            "PUBLIC_BASE_URL",
            "CADDY_SITE_ADDRESS",
            "POSTGRES_USER",
            "POSTGRES_PASSWORD",
            "POSTGRES_DB",
            "TELEGRAM_BOT_TOKEN",
            "INTERNAL_API_TOKEN",
            "ADMIN_BASIC_USER",
            "ADMIN_BASIC_PASSWORD",
            "MINIAPP_SESSION_SECRET"
          ];

          const missing = required.filter((name) => !env[name]);
          if (missing.length > 0) {
            console.error(`Missing required GitHub secrets: ${missing.join(", ")}`);
            process.exit(1);
          }

          const databaseUrl = `postgresql://${encodeURIComponent(env.POSTGRES_USER)}:${encodeURIComponent(
            env.POSTGRES_PASSWORD
          )}@postgres:5432/${encodeURIComponent(env.POSTGRES_DB)}?schema=public`;

          const quote = (value) => `'${String(value ?? "").replace(/\\/g, "\\\\").replace(/'/g, "\\'")}'`;
          const line = (key, value) => `${key}=${quote(value)}`;

          const lines = [
            line("NODE_ENV", "production"),
            line("PUBLIC_BASE_URL", env.PUBLIC_BASE_URL),
            line("CADDY_SITE_ADDRESS", env.CADDY_SITE_ADDRESS),
            line("DATABASE_URL", databaseUrl),
            line("POSTGRES_USER", env.POSTGRES_USER),
            line("POSTGRES_PASSWORD", env.POSTGRES_PASSWORD),
            line("POSTGRES_DB", env.POSTGRES_DB),
            "",
            line("TELEGRAM_BOT_TOKEN", env.TELEGRAM_BOT_TOKEN),
            line("TELEGRAM_BOT_USERNAME", env.TELEGRAM_BOT_USERNAME),
            line("TELEGRAM_PAYMENT_PROVIDER_TOKEN", env.TELEGRAM_PAYMENT_PROVIDER_TOKEN),
            line("TELEGRAM_WEBHOOK_SECRET", env.TELEGRAM_WEBHOOK_SECRET),
            line("INTERNAL_API_TOKEN", env.INTERNAL_API_TOKEN),
            line("ADMIN_BASIC_USER", env.ADMIN_BASIC_USER),
            line("ADMIN_BASIC_PASSWORD", env.ADMIN_BASIC_PASSWORD),
            "",
            line("YOOKASSA_SHOP_ID", env.YOOKASSA_SHOP_ID),
            line("YOOKASSA_SECRET_KEY", env.YOOKASSA_SECRET_KEY),
            line("YOOKASSA_WEBHOOK_SECRET", env.YOOKASSA_WEBHOOK_SECRET),
            line("YOOKASSA_CURRENCY", env.YOOKASSA_CURRENCY || "RUB"),
            "",
            line("MINIAPP_SESSION_SECRET", env.MINIAPP_SESSION_SECRET),
            line("MINIAPP_SESSION_TTL_SECONDS", env.MINIAPP_SESSION_TTL_SECONDS || "1800"),
            "",
            line("KINESCOPE_API_TOKEN", env.KINESCOPE_API_TOKEN),
            line("KINESCOPE_PRIVACY_MODE", env.KINESCOPE_PRIVACY_MODE || "private_domains"),
            "",
            line("API_BASE_URL", "http://api:3001"),
            line("BOT_MODE", "webhook"),
            line("COURSE_SLUG", env.COURSE_SLUG || "basic-course"),
            line("NEXT_PUBLIC_API_BASE_URL", ""),
            "",
            line("API_IMAGE", env.API_IMAGE),
            line("BOT_IMAGE", env.BOT_IMAGE),
            line("MINIAPP_IMAGE", env.MINIAPP_IMAGE),
            line("MIGRATE_IMAGE", env.MIGRATE_IMAGE)
          ];

          fs.writeFileSync(".deploy.env", `${lines.join("\n")}\n`, { mode: 0o600 });
          NODE

      - name: Build production images
        env:
          API_IMAGE: tgbot/api:${{ github.sha }}
          BOT_IMAGE: tgbot/bot:${{ github.sha }}
          MINIAPP_IMAGE: tgbot/miniapp:${{ github.sha }}
          MIGRATE_IMAGE: tgbot/migrate:${{ github.sha }}
        run: |
          set -euo pipefail
          docker compose build api bot miniapp migrate

      - name: Package deployment bundle
        env:
          API_IMAGE: tgbot/api:${{ github.sha }}
          BOT_IMAGE: tgbot/bot:${{ github.sha }}
          MINIAPP_IMAGE: tgbot/miniapp:${{ github.sha }}
          MIGRATE_IMAGE: tgbot/migrate:${{ github.sha }}
        run: |
          set -euo pipefail
          docker save "$API_IMAGE" "$BOT_IMAGE" "$MINIAPP_IMAGE" "$MIGRATE_IMAGE" | gzip > images.tar.gz
          tar -czf release.tar.gz docker-compose.yml infra/caddy/Caddyfile infra/docker infra/scripts/prod-cleanup.sh

      - name: Upload release
        run: |
          set -euo pipefail
          port="${DEPLOY_PORT:-22}"
          remote="$DEPLOY_USER@$DEPLOY_HOST"
          escaped_path="$(printf '%q' "$DEPLOY_PATH")"
          ssh -i ~/.ssh/deploy_key -p "$port" "$remote" "mkdir -p $escaped_path/releases $escaped_path/shared"
          scp -i ~/.ssh/deploy_key -P "$port" release.tar.gz images.tar.gz .deploy.env "$remote:$DEPLOY_PATH/"

      - name: Deploy on server
        run: |
          set -euo pipefail
          port="${DEPLOY_PORT:-22}"
          remote="$DEPLOY_USER@$DEPLOY_HOST"
          remote_env="$(printf 'DEPLOY_PATH=%q GITHUB_SHA=%q' "$DEPLOY_PATH" "$GITHUB_SHA")"
          ssh -i ~/.ssh/deploy_key -p "$port" "$remote" "$remote_env bash -se" <<'REMOTE'
          set -euo pipefail

          release_dir="$DEPLOY_PATH/releases/$GITHUB_SHA"
          archive_path="$DEPLOY_PATH/release.tar.gz"
          images_path="$DEPLOY_PATH/images.tar.gz"
          shared_env_path="$DEPLOY_PATH/shared/.env"

          mkdir -p "$release_dir" "$DEPLOY_PATH/shared"
          mv "$DEPLOY_PATH/.deploy.env" "$shared_env_path"
          chmod 600 "$shared_env_path"

          tar -xzf "$archive_path" -C "$release_dir"
          rm -f "$archive_path"
          ln -sfn "$shared_env_path" "$release_dir/.env"
          ln -sfn "$release_dir" "$DEPLOY_PATH/current"

          cd "$DEPLOY_PATH/current"

          echo "Disk before cleanup:"
          df -h /

          KEEP_PROJECT=tgbot sh infra/scripts/prod-cleanup.sh

          echo "Disk after cleanup:"
          df -h /

          docker load -i "$images_path"
          rm -f "$images_path"

          docker compose -p tgbot up -d postgres
          docker compose -p tgbot run --rm -T --no-build migrate
          docker compose -p tgbot up -d --remove-orphans --wait --wait-timeout 180 --no-build
          docker compose -p tgbot ps
          docker compose -p tgbot exec -T api wget -qO- http://127.0.0.1:3001/api/health
          docker compose -p tgbot exec -T bot wget -qO- http://127.0.0.1:3002/health
          docker compose -p tgbot exec -T miniapp wget -qO- http://127.0.0.1:3000 >/dev/null
          set -a
          . "$shared_env_path"
          set +a
          curl -fsS --retry 12 --retry-delay 5 "https://${CADDY_SITE_ADDRESS}/api/health"

          docker builder prune -af --filter "until=24h" 2>/dev/null || true

          find "$DEPLOY_PATH/releases" -mindepth 1 -maxdepth 1 -type d | sort | head -n -5 | xargs -r rm -rf
          REMOTE
