services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-course}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-course}
      POSTGRES_DB: ${POSTGRES_DB:-course}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-course} -d ${POSTGRES_DB:-course}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ${API_IMAGE:-tgbot/api:local}
    restart: unless-stopped
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 3001
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/api/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    image: ${MIGRATE_IMAGE:-tgbot/migrate:local}
    profiles: ["tools"]
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.migrate
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy

  bot:
    image: ${BOT_IMAGE:-tgbot/bot:local}
    restart: unless-stopped
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.bot
    env_file:
      - path: .env
        required: false
    environment:
      API_BASE_URL: http://api:3001
      BOT_MODE: webhook
      PORT: 3002
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3002/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5

  miniapp:
    image: ${MINIAPP_IMAGE:-tgbot/miniapp:local}
    restart: unless-stopped
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.miniapp
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000 >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
      bot:
        condition: service_healthy
      miniapp:
        condition: service_healthy

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
